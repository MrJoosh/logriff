[project]
name = "logpulse"
version = "0.1.0"
description = "Multi-language CLI log filter and aggregator"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
logpulse = "logpulse:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
