[package]
name = "logriff"
version = "0.1.0"
edition = "2021"
description = "Multi-language CLI log filter and aggregator"
license = "MIT"

[[bin]]
name = "logriff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
